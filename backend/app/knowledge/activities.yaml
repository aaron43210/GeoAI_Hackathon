# Activity profiles: the single source of truth for venue discovery, comfort, gates and weights.
# Threshold sources:
#   apparent temperature: NOAA heat-index bands (32-41 °C "extreme caution", >41 °C "danger"), shifted per exertion
#   us_aqi: US EPA AQI activity guidance: 101-150 sensitive groups reduce exertion; 151-200 everyone reduce
#           prolonged/heavy exertion, sensitive groups avoid it; 201-300 everyone avoid prolonged exertion; 301+ hazardous
#   uv_index: WHO UV index (6-7 high, 8-10 very high, 11+ extreme)
#   gusts: Beaufort 6-8 (39-74 km/h) where play/structures become hard or unsafe
# Limits: *_max / *_caution are upper bounds, *_min are lower bounds. Profiles may only tighten them.

defaults:
  daylight: preferred          # required | preferred | any
  exertion: moderate           # low | moderate | high  -> air-quality sensitivity
  default_duration_min: 60
  default_radius_km: 10
  min_area_m2: 0
  comfort: {apparent_lo: 15, apparent_hi: 29}
  wind_comfort_kmh: 25
  limits:
    apparent_max: 40
    apparent_caution: 33
    temp_min: 3
    gust_max: 55
    gust_caution: 38
    precip_prob_max: 80
    precip_prob_caution: 40
    us_aqi_max: 200
    us_aqi_unhealthy: 150
    us_aqi_caution: 100
    uv_caution: 8
  weights: {thermal: 0.22, rain: 0.15, wind: 0.06, uv: 0.07, air: 0.15, exposure: 0.12, setting: 0.1, access: 0.08, light: 0.05}
  setting: {green: 0.6, water: 0.2, quiet: 0.2}

activities:
  running:
    label: Running / jogging
    synonyms: [run, running, jog, jogging, sprint, sprints, marathon, 5k, 10k, half marathon]
    exertion: high
    nominatim_phrases: [park, running track, garden]   # fallback venue search (Nominatim special phrases) if Overpass is down
    venues: ['nwr["leisure"="park"]', 'nwr["leisure"="track"]["access"!~"private|no"]', 'nwr["leisure"="nature_reserve"]', 'nwr["leisure"="garden"]']
    min_area_m2: 8000
    comfort: {apparent_lo: 10, apparent_hi: 27}
    limits: {apparent_max: 38, apparent_caution: 31}
    weights: {thermal: 0.24, rain: 0.12, wind: 0.04, uv: 0.06, air: 0.22, exposure: 0.16, setting: 0.08, access: 0.06, light: 0.02}

  walking:
