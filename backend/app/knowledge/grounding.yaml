# Grounding verifier vocabulary (evidence/grounding.py).

# Units recognised after a number. A "number unit" pair in the answer must appear (same number, same unit
# family) in the fact sheet.
units:
  temp: ["°c", "° c", "degrees", "deg c", "c"]
  percent: ["%", "percent"]
  speed: ["km/h", "kmph", "kph"]
  distance_km: ["km", "kms", "kilometres", "kilometers"]
  distance_m: ["m", "metres", "meters"]
  minutes: ["min", "mins", "minutes"]
  litres: ["l", "litre", "litres", "liter", "liters"]
  pm: ["µg/m³", "ug/m3", "μg/m³"]
  score: ["/100"]

# Severity alignment: if the fact sheet flags a variable (a caution/avoid line mentions the trigger), the answer
# must not describe that variable positively.
polarity:
  - flag_triggers: ["US AQI", "PM2.5"]
    flagged_when: ["above", "limit", "N95", "unhealthy", "caution"]
    forbidden: ["good air", "clean air", "fresh air", "excellent air", "healthy air", "air is good", "air quality is good",
                "good air quality", "great air", "low pollution", "pollution-free", "manageable", "not a concern",
                "nothing to worry", "safe to play", "safe for exercise", "within safe limits", "within the safe",
                "still safe", "safe limits", "acceptable levels", "safe for outdoor"]
    forbidden_regex: ['\b(?:low|good|clean|great|excellent|healthy|safe|fine|decent|pleasant|acceptable|moderate|okay|ok|reasonable)\s+(?:us\s+)?(?:aqi|air|pm2\.5)',
                      '\b(?:air|air quality|aqi)\s+(?:is|looks|remains|stays)\s+(?:good|fine|acceptable|okay|ok|clean|decent|reasonable|healthy|safe)']
    # the mirror rule: when the data does NOT flag air quality, alarm language about it is false
    forbidden_when_unflagged_regex: ['\b(?:aqi|pm2\.5|air quality|pollution)\b[^.\n]{0,60}\b(?:exceed\w*|unhealthy|harmful|hazard\w*|unsafe|dangerous|poor|bad)\b',
                                     '\b(?:unhealthy|harmful|hazardous|unsafe|dangerous|poor|bad)\s+(?:air|aqi|pm2\.5|air quality)\b']
  - flag_triggers: ["feels-like temperature"]
    flagged_when: ["above", "limit", "warm"]
    forbidden: ["cool weather", "pleasant temperature", "comfortable temperature", "mild temperature", "nice and cool"]
    forbidden_regex: ['\b(?:cool|mild|pleasant|comfortable)\s+(?:feels-like|temperature|weather)']
    forbidden_when_unflagged_regex: ['\b(?:too hot|extreme heat|dangerously hot|heatwave|scorching)\b']
  - flag_triggers: ["rain probability"]
    flagged_when: ["caution: rain", "above"]
    forbidden: ["no rain", "dry conditions", "zero chance of rain"]

# A citation must sit next to its own value: the number nearest to "[E#]" (within this many characters) must
# appear on that fact's line in the fact sheet.
citation_window_chars: 14

# Any stretch of this many characters appearing twice marks the answer as looping (it is then repaired/templated).
repetition_min_chars: 40

# A fact-sheet HEALTH WARNING must be stated in the answer.
health_warning:
  required_any: ["warning", "unhealthy", "reduce", "limit", "light and short", "avoid prolonged", "sensitive"]

# Claims of absence must be true: if the sheet lists OTHER OPTIONS, the answer may not deny them.
absence_claims: ["no other options", "no alternatives", "no other option", "no other places", "no other venues"]

# Comparative claims between two numbers in one clause must be true ("45 exceeds 200" is rejected).
comparisons:
  greater: [exceeds, exceeding, exceeded, exceed, above, over, higher than, more than, greater than, beyond]
  lower: [below, under, within, less than, lower than]
  max_gap_chars: 60
  # the same check for clock times: "19:00 … before sunset at 17:49" is false
  time_before: [before, earlier than, ahead of, prior to]
  time_after: [after, later than, past]

# Fuzzy-match thresholds (0-100) for place names in answers and for the must-mention recommended place.
name_match_ratio: 88
mention_match_ratio: 85

# Capitalised terms that are not place names (never flagged as invented places).
known_terms: [Best Pick, Other Options, Watch For, Not Recommended, Health Warning, Feels Like, US AQI, Air Quality,
              Air Quality Index, United States, Environmental Protection Agency, World Health Organization,
              Open Meteo, OpenStreetMap, Open Street Map, Copernicus, Copernicus Atmosphere Monitoring Service,
              Project OSRM, Particulate Matter, Heat Index, Ultra Violet, Rain Probability, Data Note]

# When nothing is recommended, the answer must say so and must not present a "best pick".
not_recommended:
  required_any: ["not recommended", "not advisable", "avoid", "not safe", "unsafe"]
  forbidden: ["**best pick:**", "best pick:"]
